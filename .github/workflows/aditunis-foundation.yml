name: Aditunis Foundation
on:
  push:
    branches:
      - "feature/aditunis-foundation-ci"
    paths:
      - "aditunis/**"
      - ".github/workflows/aditunis-foundation.yml"
  pull_request:
    paths:
      - "aditunis/**"
      - ".github/workflows/aditunis-foundation.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aditunis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
