name: Aditunis Foundation
on:
  push:
    branches:
      - "feature/aditunis-foundation-ci"
    paths:
      - "aditunis/**"
      - ".github/workflows/aditunis-foundation.yml"
  pull_request:
    paths:
      - "aditunis/**"
      - ".github/workflows/aditunis-foundation.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aditunis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Commit bootstrap lockfile on staging
        if: github.event_name == 'push' && github.ref_name == 'feature/aditunis-foundation-ci'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already pinned"
          else
            git commit -m "chore(aditunis): pin dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aditunis-pnpm-lock
          path: aditunis/pnpm-lock.yaml
          if-no-files-found: error
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
